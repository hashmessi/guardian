<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Process Guardian architecture: telemetry flows through adapter, fingerprint, drift sentinel, quality risk, root cause, intervention engine and recommendation with an abstain gate; the operator applies the fix, recovery is verified and the suspect lot is contained. A 13-state machine and audit trail wrap the loop, stored in SQLite and served by FastAPI to a React UI."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17202A"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0F7B4F"/></marker></defs><rect width="1200" height="600" rx="18" fill="#FFFFFF" stroke="#C9D3CE"/><text x="30" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F7B4F" text-anchor="start">DECISION LOOP</text><rect x="30" y="56" width="118" height="84" rx="12" fill="#F1F5F3" stroke="#9AA5A0" stroke-width="2.5"/><text x="89.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17202A" text-anchor="middle">Telemetry</text><text x="89.0" y="114.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#46525C" text-anchor="middle">simulator / input</text><rect x="176" y="56" width="118" height="84" rx="12" fill="#fff" stroke="#0F7B4F" stroke-width="2.5"/><text x="235.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17202A" text-anchor="middle">Adapter</text><text x="235.0" y="114.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#46525C" text-anchor="middle">normalize, validate</text><line x1="151" y1="98.0" x2="173" y2="98.0" stroke="#17202A" stroke-width="2.5" marker-end="url(#a)"/><rect x="322" y="56" width="118" height="84" rx="12" fill="#fff" stroke="#0F7B4F" stroke-width="2.5"/><text x="381.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17202A" text-anchor="middle">Fingerprint</text><text x="381.0" y="114.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#46525C" text-anchor="middle">baseline envelope</text><line x1="297" y1="98.0" x2="319" y2="98.0" stroke="#17202A" stroke-width="2.5" marker-end="url(#a)"/><rect x="468" y="56" width="118" height="84" rx="12" fill="#fff" stroke="#0F7B4F" stroke-width="2.5"/><text x="527.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17202A" text-anchor="middle">Sentinel</text><text x="527.0" y="114.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#46525C" text-anchor="middle">EWMA, CUSUM</text><line x1="443" y1="98.0" x2="465" y2="98.0" stroke="#17202A" stroke-width="2.5" marker-end="url(#a)"/><rect x="614" y="56" width="118" height="84" rx="12" fill="#fff" stroke="#0F7B4F" stroke-width="2.5"/><text x="673.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17202A" text-anchor="middle">Quality risk</text><text x="673.0" y="114.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#46525C" text-anchor="middle">calibrated GBM</text><line x1="589" y1="98.0" x2="611" y2="98.0" stroke="#17202A" stroke-width="2.5" marker-end="url(#a)"/><rect x="760" y="56" width="118" height="84" rx="12" fill="#fff" stroke="#0F7B4F" stroke-width="2.5"/><text x="819.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17202A" text-anchor="middle">Root cause</text><text x="819.0" y="114.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#46525C" text-anchor="middle">ranked evidence</text><line x1="735" y1="98.0" x2="757" y2="98.0" stroke="#17202A" stroke-width="2.5" marker-end="url(#a)"/><rect x="906" y="56" width="118" height="84" rx="12" fill="#fff" stroke="#0F7B4F" stroke-width="2.5"/><text x="965.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17202A" text-anchor="middle">Interventions</text><text x="965.0" y="114.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#46525C" text-anchor="middle">candidates + CoPQ</text><line x1="881" y1="98.0" x2="903" y2="98.0" stroke="#17202A" stroke-width="2.5" marker-end="url(#a)"/><rect x="1052" y="56" width="118" height="84" rx="12" fill="#fff" stroke="#0F7B4F" stroke-width="2.5"/><text x="1111.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17202A" text-anchor="middle">Recommend</text><text x="1111.0" y="114.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#46525C" text-anchor="middle">abstain gate</text><line x1="1027" y1="98.0" x2="1049" y2="98.0" stroke="#17202A" stroke-width="2.5" marker-end="url(#a)"/><rect x="1018" y="156" width="158" height="34" rx="17" fill="#FBF1DC" stroke="#9A5F00" stroke-width="2"/><text x="1097.0" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9A5F00" text-anchor="middle">ABSTAIN if conf &lt; 0.65</text><rect x="1052" y="262" width="118" height="84" rx="12" fill="#F1F5F3" stroke="#17202A" stroke-width="2.5"/><text x="1111.0" y="300.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17202A" text-anchor="middle">Operator</text><text x="1111.0" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#46525C" text-anchor="middle">applies fix by hand</text><rect x="906" y="262" width="118" height="84" rx="12" fill="#fff" stroke="#17202A" stroke-width="2.5"/><text x="965.0" y="300.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17202A" text-anchor="middle">Recovery check</text><text x="965.0" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#46525C" text-anchor="middle">stability window</text><rect x="760" y="262" width="118" height="84" rx="12" fill="#fff" stroke="#17202A" stroke-width="2.5"/><text x="819.0" y="300.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17202A" text-anchor="middle">Containment</text><text x="819.0" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#46525C" text-anchor="middle">suspect lot window</text><line x1="1111.0" y1="192" x2="1111.0" y2="259" stroke="#17202A" stroke-width="2.5" marker-end="url(#a)"/><text x="1121.0" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#46525C" text-anchor="start">advice</text><line x1="1049" y1="304.0" x2="1027" y2="304.0" stroke="#17202A" stroke-width="2.5" marker-end="url(#a)"/><line x1="903" y1="304.0" x2="881" y2="304.0" stroke="#17202A" stroke-width="2.5" marker-end="url(#a)"/><rect x="598" y="262" width="150" height="84" rx="12" fill="#F1F5F3" stroke="#9AA5A0" stroke-width="2.5"/><text x="673.0" y="300.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17202A" text-anchor="middle">Checkpoints</text><text x="673.0" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#46525C" text-anchor="middle">moisture, spray, note</text><line x1="673.0" y1="259" x2="673.0" y2="143" stroke="#0F7B4F" stroke-width="2.5" marker-end="url(#ag)"/><text x="683.0" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F7B4F" text-anchor="start">human channel</text><rect x="30" y="156" width="174" height="34" rx="17" fill="#FBF1DC"/><text x="117.0" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9A5F00" text-anchor="middle">Read-only: no PLC write</text><rect x="30" y="392" width="1140" height="62" rx="14" fill="#E3F0EA"/><text x="60" y="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F7B4F" text-anchor="start">State machine</text><text x="190" y="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#17202A" text-anchor="start">13 validated states, HEALTHY to RELEASE, every transition logged to the audit trail</text><line x1="381.0" y1="140" x2="381.0" y2="392" stroke="#0F7B4F" stroke-width="1.5" stroke-dasharray="4 5" opacity=".0"/><line x1="527.0" y1="140" x2="527.0" y2="392" stroke="#0F7B4F" stroke-width="1.5" stroke-dasharray="4 5" opacity=".0"/><line x1="1171.0" y1="140" x2="1171.0" y2="392" stroke="#0F7B4F" stroke-width="1.5" stroke-dasharray="4 5" opacity=".0"/><rect x="30" y="492" width="300" height="74" rx="12" fill="#fff" stroke="#17202A" stroke-width="2.5"/><text x="180.0" y="525.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17202A" text-anchor="middle">SQLite</text><text x="180.0" y="545.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#46525C" text-anchor="middle">17 tables, in-memory by default</text><rect x="450" y="492" width="300" height="74" rx="12" fill="#fff" stroke="#0F7B4F" stroke-width="2.5"/><text x="600.0" y="525.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17202A" text-anchor="middle">FastAPI  /api/*</text><text x="600.0" y="545.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#46525C" text-anchor="middle">ingest, decid